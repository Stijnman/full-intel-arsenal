name: OSINTMaster Ultra MVP
on:
  push:
    branches:
      - feature/osintmaster-ultra-mvp
  pull_request:
    paths:
      - "osintmaster-ultra/**"
      - ".github/workflows/osintmaster-mvp.yml"
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python modules
        run: python -m py_compile engine.py ui.py
        working-directory: osintmaster-ultra
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
        working-directory: osintmaster-ultra
